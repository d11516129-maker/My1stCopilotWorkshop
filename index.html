<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f5ef" />
    <title>日常待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <section class="todo-card" aria-labelledby="page-title">
        <header class="card-header">
          <p class="eyebrow">MAKE ROOM FOR WHAT MATTERS</p>
          <h1 id="page-title">日常待辦</h1>
          <p class="intro">一件一件完成，讓今天更從容。</p>
        </header>

        <form class="todo-form" id="todo-form">
          <label class="visually-hidden" for="todo-input">新增待辦事項</label>
          <input
            id="todo-input"
            name="todo"
            type="text"
            placeholder="接下來想完成什麼？"
            autocomplete="off"
            maxlength="200"
          />
          <button class="add-button" type="submit">
            <span aria-hidden="true">+</span>
            新增
          </button>
        </form>

        <ul class="todo-list" id="todo-list" aria-label="待辦事項清單"></ul>

        <footer class="card-footer">
          <p class="remaining-count" id="remaining-count" aria-live="polite">未完成：0 項</p>
          <span class="footer-mark" aria-hidden="true">ONE THING AT A TIME</span>
        </footer>
      </section>
      <p class="page-note">慢慢來，也是在前進。</p>
    </main>
  </body>
